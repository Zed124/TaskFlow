[package]
name = "taskflow"
version = "1.0.0"
description = "TaskFlow — local-first personal task manager"
authors = ["TaskFlow"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows-specific cargo issue:
# https://github.com/rust-lang/cargo/issues/8519).
name = "taskflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
thiserror = "2.0.21"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.8.1"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-dialog = "2.8.4"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
